name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test frontend behavior
        run: node --test tests/status_frontend.test.cjs
      - name: Compile coordination tools
        run: python -m py_compile tools/github_coordination.py tools/once_verify.py tools/authorization.py tools/policy_check.py tools/evidence.py tools/workflow.py tools/workflow_demo.py tools/status_web.py tools/status_auth.py tools/task_approvals.py tools/task_dispatch.py tools/codex_executor.py tools/project_codex_executor.py tools/project_task_planner.py
      - name: Run workflow sandbox
        run: python tools/workflow_demo.py --simulate-approval >/dev/null
      - name: Validate example configuration
        run: |
          python -m json.tool config/github-coordination.example.json >/dev/null
          python -m json.tool config/project-authorization.example.json >/dev/null
          python -m json.tool config/codex-executor.example.json >/dev/null
          python -m json.tool config/codex-project-executor.example.json >/dev/null
          python -m json.tool config/codex-task-planner.example.json >/dev/null
